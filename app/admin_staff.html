<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>スタッフ登録・削除</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>スタッフ登録・削除</h1>

<div id="adminContent">
  <div class="controls">
    <button id="backBtn" class="btn btn-quiet">← 管理ページに戻る</button>
    <button id="addStaffBtn" class="btn btn-primary">＋ スタッフを追加</button>
  </div>

  <div id="staffTableWrap"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="db.js"></script>
<script>
(async function () {
  const dataReady = ShiftDB.ready();
  await ShiftDB.requireAuth();
  await dataReady;
  const ATTRIBUTES = ["指定なし", "厨房専門", "ホール専門", "厨房優先", "ホール優先", "ヘルプ", "研修", "料理長"];
  const DEFAULT_ATTRIBUTE = "指定なし";

  let state = loadState() || { startDate: toIsoDate(new Date()), staff: [], cells: {} };
  migrateStaffNames();

  const adminContent = document.getElementById("adminContent");
  const backBtn = document.getElementById("backBtn");
  const addStaffBtn = document.getElementById("addStaffBtn");
  const staffTableWrap = document.getElementById("staffTableWrap");

  backBtn.addEventListener("click", () => {
    ShiftDB.go("admin.html");
  });

  addStaffBtn.addEventListener("click", () => {
    state.staff.push({ id: cryptoId(), lastName: "", firstName: "", name: "", attribute: DEFAULT_ATTRIBUTE });
    saveState();
    renderStaffTable();
  });

  showAdminContent();

  function showAdminContent() {
    adminContent.style.display = "block";
    renderStaffTable();
  }

  function renderStaffTable() {
    if (state.staff.length === 0) {
      staffTableWrap.innerHTML = `<p class="empty-note">スタッフが登録されていません。「＋ スタッフを追加」で追加してください。</p>`;
      return;
    }

    let html = "<table><thead><tr><th></th><th>姓</th><th>名</th><th>属性</th></tr></thead><tbody>";
    for (const person of state.staff) {
      const attribute = person.attribute || DEFAULT_ATTRIBUTE;
      html += `<tr class="staff-row" draggable="true" data-staff-row="${person.id}">` +
        `<td><span class="drag-handle" title="ドラッグして並び替え">&#8942;&#8942;</span></td>` +
        `<td><div class="name-cell">` +
        `<button class="del-row-btn" data-del="${person.id}" title="このスタッフを削除">×</button>` +
        `<input type="text" class="last-name-input" data-staff-last="${person.id}" value="${escapeHtml(person.lastName || "")}" placeholder="姓">` +
        `</div></td>` +
        `<td><input type="text" class="first-name-input" data-staff-first="${person.id}" value="${escapeHtml(person.firstName || "")}" placeholder="名"></td>` +
        `<td><select class="attr-select" data-staff-attr="${person.id}">${buildAttributeOptions(attribute)}</select></td></tr>`;
    }
    html += "</tbody></table>";

    staffTableWrap.innerHTML = html;
    bindStaffTableEvents();
  }

  function buildAttributeOptions(currentValue) {
    return ATTRIBUTES.map(attr => {
      const selected = attr === currentValue ? "selected" : "";
      return `<option value="${escapeHtml(attr)}" ${selected}>${escapeHtml(attr)}</option>`;
    }).join("");
  }

  function bindStaffTableEvents() {
    staffTableWrap.querySelectorAll(".last-name-input").forEach(input => {
      input.addEventListener("change", () => {
        const person = state.staff.find(p => p.id === input.dataset.staffLast);
        if (person) {
          person.lastName = input.value;
          person.name = combineName(person.lastName, person.firstName);
          saveState();
        }
      });
    });

    staffTableWrap.querySelectorAll(".first-name-input").forEach(input => {
      input.addEventListener("change", () => {
        const person = state.staff.find(p => p.id === input.dataset.staffFirst);
        if (person) {
          person.firstName = input.value;
          person.name = combineName(person.lastName, person.firstName);
          saveState();
        }
      });
    });

    staffTableWrap.querySelectorAll(".attr-select").forEach(select => {
      select.addEventListener("change", () => {
        const person = state.staff.find(p => p.id === select.dataset.staffAttr);
        if (person) {
          person.attribute = select.value;
          saveState();
        }
      });
    });

    staffTableWrap.querySelectorAll(".del-row-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const id = btn.dataset.del;
        if (!confirm("このスタッフを削除しますか？登録済みのシフト希望も削除されます。")) return;
        state.staff = state.staff.filter(p => p.id !== id);
        for (const key of Object.keys(state.cells)) {
          if (key.startsWith(id + "_")) delete state.cells[key];
        }
        saveState();
        renderStaffTable();
      });
    });

    bindDragAndDrop();
  }

  function bindDragAndDrop() {
    let draggedId = null;

    const rows = staffTableWrap.querySelectorAll(".staff-row");
    rows.forEach(row => {
      row.addEventListener("dragstart", () => {
        draggedId = row.dataset.staffRow;
        row.classList.add("dragging");
      });

      row.addEventListener("dragend", () => {
        row.classList.remove("dragging");
        rows.forEach(r => r.classList.remove("drag-over"));
      });

      row.addEventListener("dragover", (e) => {
        e.preventDefault();
        if (row.dataset.staffRow !== draggedId) {
          row.classList.add("drag-over");
        }
      });

      row.addEventListener("dragleave", () => {
        row.classList.remove("drag-over");
      });

      row.addEventListener("drop", (e) => {
        e.preventDefault();
        row.classList.remove("drag-over");
        const targetId = row.dataset.staffRow;
        if (!draggedId || draggedId === targetId) return;

        const fromIndex = state.staff.findIndex(p => p.id === draggedId);
        const toIndex = state.staff.findIndex(p => p.id === targetId);
        if (fromIndex === -1 || toIndex === -1) return;

        const [moved] = state.staff.splice(fromIndex, 1);
        state.staff.splice(toIndex, 0, moved);

        saveState();
        renderStaffTable();
      });
    });
  }

  function saveState() {
    ShiftDB.save(state);
  }

  function loadState() {
    return ShiftDB.loaded();
  }

  function toIsoDate(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  }

  function cryptoId() {
    return Math.random().toString(36).slice(2, 10);
  }

  function combineName(lastName, firstName) {
    return [lastName || "", firstName || ""].filter(s => s.trim() !== "").join(" ");
  }

  function migrateStaffNames() {
    let changed = false;
    for (const person of state.staff) {
      if (person.lastName === undefined || person.firstName === undefined) {
        person.lastName = person.lastName || person.name || "";
        person.firstName = person.firstName || "";
        person.name = combineName(person.lastName, person.firstName);
        changed = true;
      }
    }
    if (changed) saveState();
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }
})();
</script>

</body>
</html>
