<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>自動シフト作成</title>
<style>
  * {
    box-sizing: border-box;
  }
  body {
    font-family: "Yu Gothic", "Meiryo", sans-serif;
    margin: 16px;
    font-size: 14px;
  }
  h1 {
    font-size: 18px;
    margin-bottom: 12px;
  }
  .controls {
    margin-bottom: 12px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 12px;
  }
  button {
    cursor: pointer;
    font-size: 13px;
  }
  #backBtn, #regenerateBtn, #printBtn, #sendBtn {
    padding: 4px 10px;
  }
  #regenerateBtn {
    background: #1a5fb4;
    color: #fff;
    border-color: #1a5fb4;
    font-weight: bold;
  }
  .empty-note {
    color: #999;
    font-size: 13px;
  }

  /* --- A4一週間分シート。2枚横並び（スマホは縦並びで画面いっぱい） --- */
  .sheets-wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    justify-content: center;
    align-items: flex-start;
  }
  .a4-sheet {
    background: #fff;
    border: 1px solid #333;
    box-shadow: 0 1px 5px rgba(0,0,0,0.15);
    padding: 10px 10px 12px;
    width: 560px;
    max-width: 100%;
    aspect-ratio: 210 / 297;
    display: flex;
    flex-direction: column;
    overflow: visible;   /* 幅が狭い画面でも中身を切らず、A4比率より内容が高ければシートが縦に伸びる */
  }
  .sheet-title-box {
    align-self: center;
    border: 2px solid #333;
    border-radius: 4px;
    padding: 3px 26px;
    font-size: 16px;
    font-weight: bold;
    letter-spacing: 6px;
    margin-bottom: 8px;
  }
  .sheet-range {
    text-align: center;
    font-size: 11px;
    color: #555;
    margin-bottom: 6px;
  }
  .a4-sheet table {
    border-collapse: collapse;
    table-layout: fixed;
    width: 100%;
    flex: 0 0 auto;   /* 表はシートいっぱいに伸ばさず、余った高さは下の余白にする */
  }
  .a4-sheet th, .a4-sheet td {
    border: 1px solid #555;
    padding: 2px 2px;
    text-align: center;
    vertical-align: middle;
    overflow: hidden;
  }
  .a4-sheet thead th {
    background: #f0f0f0;
    font-size: 12px;
  }
  /* 役割列は縦書き「厨房」がちょうど収まる幅に固定し、残りの幅は曜日の列で均等に分け合う（table-layout: fixedは1行目の幅指定で列幅が決まる） */
  .a4-sheet thead th.role-col {
    width: 30px;
    padding: 2px 1px;
  }
  .a4-sheet th.sat { color: #1a5fb4; }
  .a4-sheet th.sun { color: #c01c28; }
  .a4-sheet .role-label {
    background: #e8e8e8;
    font-weight: bold;
    writing-mode: vertical-rl;
    text-orientation: upright;
    letter-spacing: 2px;
    white-space: nowrap;
    width: 26px;
  }
  /* 料理長・ラスト行は営業/定休日行と同じ薄さにするため、縦書きをやめて横書きの小さい文字にする */
  .a4-sheet .role-label.role-label-flat {
    writing-mode: horizontal-tb;
    text-orientation: mixed;
    letter-spacing: 0;
    font-size: 9px;
    padding: 1px 2px;
  }
  /* ラストは縦書き。2行分（薄い行）の高さに収まるよう文字を小さく・字間なしにする */
  .a4-sheet .role-label.role-label-last {
    font-size: 9px;
    letter-spacing: 0;
    padding: 1px;
  }
  /* 仕込み行を半分の高さにするため、縦書きラベルの文字サイズ・字間を縮める */
  .a4-sheet .role-label.role-label-prep {
    font-size: 7px;
    letter-spacing: 0;
    padding: 1px;
  }
  .a4-sheet .biz-row th {
    font-size: 10px;
    font-weight: normal;
    padding: 1px 2px;
  }
  .a4-sheet .biz-toggle {
    border: none;
    background: none;
    cursor: pointer;
    font-size: 10px;
    padding: 2px 4px;
    border-radius: 4px;
    width: 100%;
  }
  .a4-sheet .biz-toggle.open-day {
    color: #1a5fb4;
  }
  .a4-sheet .biz-toggle.closed-day {
    color: #c01c28;
    font-weight: bold;
  }
  .a4-sheet .biz-toggle:disabled {
    cursor: default;
  }
  .a4-sheet .assign-cell {
    font-size: 11px;
    line-height: 1.25;
    padding: 1px 1px;
  }
  /* 厨房・ホールの各枠に同じ最低高さを与え、空の枠が潰れて他の枠が引き伸ばされないようにする
     （表の余白は内容の高さに比例して配分されるため、全枠の最低高さを揃えて等分にする） */
  .a4-sheet .assign-cell.role-slot {
    height: 43.25px;        /* 名前の枠（氏名＋時刻）の高さ。上下3pxのパディングを足して1行の高さになる */
    padding-top: 3px;
    padding-bottom: 3px;
  }
  /* 厨房・ホール各ブロックの一番下のマス：氏名は上、シフト追加の「＋」ボタンはマスの最下端から5px上に固定する。
     ボタンの位置は人数に関係なくどのマスでも同じ（枠と重ならないよう、下にボタン分の余白を確保する） */
  .a4-sheet td.role-slot {
    position: relative;
  }
  .a4-sheet .slot-inner {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-sizing: border-box;
    padding-bottom: 15px;
  }
  .a4-sheet .add-shift-btn {
    display: block;
    width: 100%;
    height: 11px;
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    border: 1px solid #c4c4c4;
    border-radius: 6px;
    background: #fff;
    color: #888;
    font-size: 10px;
    line-height: 9px;
    cursor: pointer;
  }
  .a4-sheet .slot-inner .add-shift-btn {
    position: absolute;
    left: 1px;
    right: 1px;
    bottom: 5px;
    width: auto;
  }
  .a4-sheet .add-shift-btn:hover {
    border-color: #8f8f8f;
    color: #444;
    background: #f3f4f6;
  }
  /* 名前＋時間の1ブロック。余白は極力詰め、複数人が重なる枠（overflow-cell）でだけ
     下マージンを広めに取って人ごとの区切りを分かりやすくする */
  .a4-sheet .assign-block {
    margin: 0;
    padding: 0;
  }
  .a4-sheet .assign-block:not(:last-child) {
    margin-bottom: 3px;
  }
  /* 厨房・ホールそれぞれの枠内の間の線は引かない（厨房とホールの間の線は残す） */
  .a4-sheet .assign-cell.pair-top {
    border-bottom: none;
  }
  .a4-sheet .assign-cell.pair-mid {
    border-top: none;
    border-bottom: none;
  }
  .a4-sheet .assign-cell.pair-bottom {
    border-top: none;
  }
  .a4-sheet .assign-name {
    font-weight: bold;
    font-size: 18px;
    margin: 0;
    padding: 0;
  }
  /* 姓のみ表示（同姓の人がいない）の場合は文字を大きくする */
  .a4-sheet .assign-name.surname-only {
    font-size: 21px;
  }
  .a4-sheet .last-cell .assign-name.surname-only {
    font-size: 18px;
  }
  .a4-sheet .chief-cell .surname-only {
    font-size: 16.5px;
  }
  .a4-sheet .chief-end {
    font-size: 10.8px;
    font-weight: bold;
    color: #000;
  }
  .a4-sheet .assign-time {
    font-size: 12px;
    font-weight: bold;
    color: #000;
    margin: 0;
    padding: 0;
  }
  /* 人数が固定行数（厨房3・ホール5）を超えた日は、その日の列の該当役割（compact-cell）だけ
     文字を小さく詰め、一番下のセル（overflow-cell）には溢れた人をまとめて表示する */
  .a4-sheet .assign-cell.compact-cell {
    line-height: 1.1;
  }
  .a4-sheet .assign-cell.compact-cell .assign-name {
    font-size: 15px;
  }
  .a4-sheet .assign-cell.compact-cell .assign-name.surname-only {
    font-size: 16.5px;
  }
  .a4-sheet .assign-cell.compact-cell .assign-time {
    font-size: 9.6px;
  }
  .a4-sheet .assign-cell.compact-cell .assign-block:not(:last-child) {
    margin-bottom: 2px;
  }
  /* 溢れ表示のマスは、行の高さ（layoutSheetRows が固定）の中に収まるよう、枠同士の間隔で調整する。
     マス（行）の高さは人数が増えても広げない。間隔が0でも収まらないときだけ .tight で文字をさらに詰める */
  .a4-sheet .assign-cell.overflow-cell .slot-inner {
    overflow: hidden;
  }
  .a4-sheet .assign-cell.overflow-cell .slot-items {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    flex: 1 1 auto;
    min-height: 0;
  }
  .a4-sheet .assign-cell.overflow-cell .assign-block:not(:last-child) {
    margin-bottom: 0;
  }
  /* 人数が行数を超えた日：ブロック全体（厨房3行／ホール5行）を1つの結合マスにする。
     中身は絶対配置でマスいっぱいに広げ、行の高さの計算には影響させない（＝ブロックの高さは固定）。
     人数が増えたぶんは枠同士の間隔（space-between）が狭まることで収まる */
  .a4-sheet td.block-merged {
    position: relative;
    padding: 0;
  }
  .a4-sheet .block-merged .block-inner {
    position: absolute;
    top: 1px;
    right: 1px;
    bottom: 1px;
    left: 1px;
    display: flex;
    flex-direction: column;
  }
  .a4-sheet .block-merged .block-items {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .a4-sheet .block-merged .assign-block:not(:last-child) {
    margin-bottom: 0;
  }
  .a4-sheet .block-merged .add-shift-btn {
    flex: 0 0 auto;
    margin-bottom: 4px;     /* inner が下端から1px内側のため、合計でマスの最下端から5px上 */
  }
  /* 間隔を0にしても収まらないときだけ、文字をさらに詰める */
  .a4-sheet .assign-cell.tight {
    line-height: 1;
  }
  .a4-sheet .assign-cell.tight .assign-name {
    font-size: 12px;
  }
  .a4-sheet .assign-cell.tight .assign-name.surname-only {
    font-size: 13px;
  }
  .a4-sheet .assign-cell.tight .assign-time {
    font-size: 8.5px;
  }
  /* --- 手動編集：氏名の枠（白抜き・薄い灰色）とドラッグ＆ドロップ --- */
  /* 枠は「氏名＋時間」をひとまとめに囲み、ドラッグでも一緒に動く。タップで編集ポップアップが開く */
  .a4-sheet .name-frame {
    display: block;
    width: 100%;
    margin-left: 0;
    margin-right: 0;
    max-width: 100%;
    box-sizing: border-box;
    text-align: center;
    background: #fff;
    border: 1px solid #c4c4c4;
    border-radius: 3px;
    padding: 0 3px;
    cursor: grab;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  .a4-sheet .name-frame:hover {
    border-color: #8f8f8f;
  }
  /* 希望と食い違う位置に置いた氏名（✕の日・希望時間外・同日の重複など）は赤枠で知らせる */
  .a4-sheet .name-frame.warn {
    border-color: #e04848;
    background: #fff1f1;
  }
  .a4-sheet .chief-cell .name-frame:not(:last-child) {
    margin-bottom: 2px;
  }
  .a4-sheet .name-frame.drag-origin {
    opacity: 0.25;
  }
  .a4-sheet .name-frame.just-dropped {
    animation: frame-snap 0.28s ease-out;
  }
  @keyframes frame-snap {
    0%   { transform: scale(1.25); box-shadow: 0 0 0 3px rgba(59,130,246,0.55); }
    60%  { transform: scale(0.95); box-shadow: 0 0 0 1px rgba(59,130,246,0.3); }
    100% { transform: scale(1);    box-shadow: none; }
  }
  body.dragging, body.dragging * {
    cursor: grabbing !important;
    user-select: none;
    -webkit-user-select: none;
  }
  .a4-sheet td.drop-candidate {
    outline: 1px dashed #93b4e8;
    outline-offset: -2px;
  }
  .a4-sheet td.drop-active {
    background: #dbeafe;
    outline: 2px solid #3b82f6;
    outline-offset: -2px;
  }
  .drag-ghost {
    position: fixed;
    z-index: 9999;
    pointer-events: none;
    margin: 0;
    box-sizing: border-box;
    background: #fff;
    border: 1px solid #8f8f8f;
    border-radius: 3px;
    padding: 0 3px;
    text-align: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    opacity: 0.95;
    white-space: nowrap;
  }
  .drag-ghost.warn {
    border-color: #e04848;
    background: #fff1f1;
  }
  .drag-ghost.snapping {
    transition: left 0.08s ease-out, top 0.08s ease-out;
  }

  /* 研修の注記：氏名の右に同じ行で「(研修)」と付記する（赤字・半角カッコ）（枠の縦幅を他と揃えるため丸囲みは使わない） */
  .a4-sheet .trainee-badge {
    display: inline;
    margin-left: 0;
    font-size: 10px;
    font-weight: normal;
    color: #c01c28;
    white-space: nowrap;
  }
  /* 研修の人は氏名と(研修)を必ず同じ行に置く。枠いっぱいになるのでパディングも詰める */
  .a4-sheet .assign-name.has-trainee {
    white-space: nowrap;
  }
  .a4-sheet .name-frame:has(.has-trainee) {
    padding-left: 0;
    padding-right: 0;
  }
  .a4-sheet .assign-empty {
    color: #c01c28;
    font-size: 10px;
  }
  .a4-sheet .help-cell {
    padding: 1px 2px;
  }
  .a4-sheet .help-text {
    color: #c01c28;
    font-weight: bold;
    font-size: 11px;
  }
  /* 料理長行：営業/定休日行と同じ薄さにするための縮小スタイル */
  .a4-sheet .chief-cell {
    font-size: 13.5px;
    line-height: 1.2;
    padding: 1px 2px;
  }
  /* 料理長行は1枠ぶんの高さ＋「＋」ボタンの余白。中身は仕込み欄と同じ結合マス方式（.block-merged）で収める */
  .a4-sheet .chief-cell.block-merged {
    height: 58px;
  }
  .a4-sheet .chief-cell.block-merged .name-frame:not(:last-child) {
    margin-bottom: 0;
  }
  /* ラスト行（厨房側・ホール側の2行）：営業/定休日行と同じ薄さ、名前のみ表示 */
  .a4-sheet .last-cell {
    font-size: 10px;
    line-height: 1.1;
    padding: 0 2px;
  }
  .a4-sheet .last-cell .assign-name {
    font-weight: bold;
  }
  /* 仕込み欄は名前の枠2つぶんの高さ（厨房・ホールの1行＝49.25px×2）。余った高さは紙面の最下部の余白 */
  .a4-sheet .prep-cell {
    height: 113.5px;   /* 名前の枠2つぶん（49.25px×2）＋「＋」ボタンの余白15px */
  }
  .a4-sheet .prep-cell .block-inner {
    top: 3px;          /* 厨房・ホールの枠と同じく、枠の上に3pxの余白 */
  }
  /* 厨房・ホールの1行の高さ（名前の枠＋上下3px）。全日が結合マスになった行でも潰れないよう行自体に指定する */
  .a4-sheet tr[data-block="kitchen"],
  .a4-sheet tr[data-block="hall"] {
    height: 49.25px;
  }
  .a4-sheet .prep-input {
    flex: 1 1 auto;
    min-height: 0;
    box-sizing: border-box;
    display: block;
    width: 100%;
    border: none;
    background: transparent;
    font-size: 9px;
    text-align: center;
    padding: 1px;
  }
  .a4-sheet .prep-input:focus {
    background: #fffbe0;
    outline: 1px solid #e0a94c;
  }
  .a4-sheet .closed-cell {
    background: #dbeafe;
    position: relative;
  }
  .a4-sheet .closed-cell .closed-mark {
    display: inline-block;
    transform: rotate(-18deg);
    color: #1a5fb4;
    font-weight: bold;
    font-size: 13px;
    border: 2px solid #1a5fb4;
    border-radius: 50%;
    width: 26px;
    height: 26px;
    line-height: 22px;
  }

  /* スマホ幅ではシートを縦並びにする。シートの中身（マスの高さ・文字サイズ）はpx固定のため、
     シートの幅だけを画面幅に縮めるとA4比率の高さが足りず下にはみ出す。そこでPCと同じ幅560pxのまま組み、
     シート全体を画面幅に合わせて等倍縮小する（縮小率 --fit-zoom は layoutSheetRows が計算して設定）。 */
  @media screen and (max-width: 900px) {
    .sheets-wrap {
      flex-direction: column;
      align-items: center;
    }
    .a4-sheet {
      width: 560px;
      max-width: none;
      zoom: var(--fit-zoom, 1);
    }
  }

  /* --- LINE送信用の画像化：印刷と同じく、A4の外枠・＋ボタン・警告の赤枠を消し、縮小せずに描画する --- */
  body.capture-mode .a4-sheet {
    zoom: 1 !important;
    border-color: transparent;
    box-shadow: none;
  }
  body.capture-mode .a4-sheet .add-shift-btn {
    visibility: hidden;
  }
  body.capture-mode .a4-sheet .name-frame.warn {
    border-color: #ccc;
    box-shadow: none;
  }
  .popup.send-popup {
    width: 460px;
  }
  .send-previews {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 12px;
  }
  .send-previews img {
    width: 120px;
    min-width: 0;
    border: 1px solid #ccc;
  }
  .popup-field textarea {
    width: 100%;
    font-size: 14px;
    padding: 6px;
    box-sizing: border-box;
    font-family: inherit;
  }
  .send-note {
    font-size: 12px;
    color: #555;
    margin-top: 4px;
  }

  /* --- popup --- */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .popup {
    background: #fff;
    border-radius: 10px;
    padding: 20px 24px;
    width: 340px;
    max-width: 90vw;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  .popup-header {
    text-align: center;
    margin-bottom: 14px;
  }
  .popup-header .p-date {
    font-size: 20px;
    font-weight: bold;
  }
  .popup-field {
    margin-bottom: 10px;
  }
  .popup-field label {
    display: block;
    font-size: 12px;
    color: #555;
    margin-bottom: 2px;
  }
  .popup-field input[type="password"],
  .popup-field input[type="text"] {
    width: 100%;
    font-size: 14px;
    padding: 6px;
    box-sizing: border-box;
  }
  .popup-field .error-text {
    color: #c01c28;
    font-size: 12px;
    margin-top: 6px;
    min-height: 14px;
  }
  .popup-footer {
    display: flex;
    justify-content: space-between;
    margin-top: 18px;
  }
  .popup-footer button {
    padding: 8px 18px;
    font-size: 14px;
    border-radius: 6px;
    border: 1px solid #999;
    background: #f5f5f5;
  }
  .popup-footer .confirm-btn {
    background: #1a5fb4;
    color: #fff;
    border-color: #1a5fb4;
    font-weight: bold;
  }

  .popup-field select {
    width: 100%;
    font-size: 14px;
    padding: 6px;
    box-sizing: border-box;
  }
  .popup-field .time-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .popup-field .time-row select {
    flex: 1;
  }
  .popup-footer .delete-btn {
    color: #c01c28;
    border-color: #c01c28;
  }
  /* --- シフト枠の編集ポップアップ --- */
  .edit-popup {
    max-height: 90vh;
    overflow-y: auto;
  }
  .edit-popup .p-sub {
    font-size: 12px;
    color: #555;
    margin-top: 2px;
  }
  .circle-list {
    margin: 0;
    padding: 6px 8px;
    list-style: none;
    max-height: 150px;
    overflow-y: auto;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 13px;
  }
  .circle-list li {
    padding: 2px 0;
  }
  .circle-list .circle-cond {
    color: #666;
    font-size: 11px;
    margin-left: 4px;
