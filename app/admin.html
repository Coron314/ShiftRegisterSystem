<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>管理ページ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>管理ページ</h1>

<div id="adminContent">
  <div class="controls">
    <button id="backBtn" class="btn btn-quiet">← シフト希望登録に戻る</button>
  </div>

  <div class="menu-list">
    <button class="menu-card" id="staffMenuBtn"><span class="menu-title">スタッフ登録・削除</span><span class="menu-desc">メンバーの追加と削除、並び順、担当の属性</span></button>
    <button class="menu-card" id="shiftParamsMenuBtn"><span class="menu-title">シフト希望を募集する</span><span class="menu-desc">募集期間の設定と通知、定休日・必要人数などの詳細設定</span></button>
    <button class="menu-card" id="passwordMenuBtn"><span class="menu-title">パスワード管理</span><span class="menu-desc">管理用の4桁パスワードを変更</span></button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="db.js"></script>
<script>
(async function () {
  await ShiftDB.requireAuth();

  const adminContent = document.getElementById("adminContent");
  const backBtn = document.getElementById("backBtn");
  const staffMenuBtn = document.getElementById("staffMenuBtn");
  const shiftParamsMenuBtn = document.getElementById("shiftParamsMenuBtn");
  const passwordMenuBtn = document.getElementById("passwordMenuBtn");

  backBtn.addEventListener("click", () => {
    ShiftDB.go("shift_availability.html");
  });

  staffMenuBtn.addEventListener("click", () => {
    ShiftDB.go("admin_staff.html");
  });

  shiftParamsMenuBtn.addEventListener("click", () => {
    ShiftDB.go("admin_shift_params.html");
  });

  passwordMenuBtn.addEventListener("click", () => {
    ShiftDB.go("admin_password.html");
  });

  adminContent.style.display = "block";
})();
</script>

</body>
</html>
