<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>シフト希望登録</title>
<style>
  * {
    box-sizing: border-box;
  }
  body {
    font-family: "Yu Gothic", "Meiryo", sans-serif;
    margin: 16px;
    font-size: 14px;
  }
  h1 {
    font-size: 18px;
    margin-bottom: 12px;
  }
  .controls {
    margin-bottom: 12px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 12px;
  }
  .controls label {
    font-size: 14px;
  }
  button {
    cursor: pointer;
    font-size: 13px;
  }
  #tableWrap {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    max-width: 100%;
    border: 1px solid #999;
    border-radius: 4px;
  }
  table {
    border-collapse: collapse;
    white-space: nowrap;
  }
  th, td {
    border: 1px solid #999;
    padding: 2px 4px;
    text-align: center;
  }
  th {
    background: #f0f0f0;
  }
  th.sat { color: #1a5fb4; }
  th.sun { color: #c01c28; }
  .name-display {
    font-weight: bold;
  }
  th:first-child, td:first-child {
    position: sticky;
    left: 0;
    z-index: 2;
    box-shadow: 2px 0 4px rgba(0,0,0,0.08);
  }
  th:first-child {
    z-index: 3;
    background: #f0f0f0;
  }
  td:first-child {
    background: #fff;
  }

  .cell-btn {
    width: 72px;
    min-height: 52px;
    border: 1px solid #ccc;
    background: #fff;
    border-radius: 4px;
    padding: 2px 2px;
    line-height: 1.3;
    font-size: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .cell-btn .placeholder {
    color: #bbb;
    font-size: 11px;
  }
  .cell-btn.cell-cross { background: #fde3e3; }
  .cell-btn.cell-circle-full { background: #dbeafe; }
  .cell-btn.cell-circle-partial { background: #eff6ff; }
  .cell-btn .mark-img-big { width: 32px; height: 32px; display: block; }
  .cell-btn .mark-img-small { width: 16px; height: 16px; display: block; margin-bottom: 2px; }
  .cell-btn .sub-line { font-size: 10px; color: #333; }

  .closed-slash-cell {
    width: 72px;
    min-height: 52px;
    background: linear-gradient(
      to bottom right,
      transparent calc(50% - 1px),
      #999 calc(50% - 1px),
      #999 calc(50% + 1px),
      transparent calc(50% + 1px)
    );
  }

  /* --- popup --- */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .popup {
    background: #fff;
    border-radius: 10px;
    padding: 20px 24px;
    width: 340px;
    max-width: 90vw;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  .popup-header {
    text-align: center;
    margin-bottom: 14px;
  }
  .popup-header .p-name {
    font-size: 13px;
    color: #666;
  }
  .popup-header .p-date {
    font-size: 20px;
    font-weight: bold;
  }
  .popup-marks {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-bottom: 18px;
  }
  .popup-mark-btn {
    width: 70px;
    height: 56px;
    border: 2px solid #ccc;
    border-radius: 8px;
    background: #fafafa;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .popup-mark-btn img {
    width: 34px;
    height: 34px;
    display: block;
  }
  .popup-mark-btn.selected {
    border-color: #666;
    background: #e4e4e4;
  }
  .popup-field {
    margin-bottom: 10px;
  }
  .popup-field label {
    display: block;
    font-size: 12px;
    color: #555;
    margin-bottom: 2px;
  }
  .popup-field select, .popup-field input[type="text"] {
    width: 100%;
    font-size: 14px;
    padding: 4px;
    box-sizing: border-box;
  }
  .popup-field input[type="text"] {
    margin-top: 4px;
  }
  .popup-footer {
    display: flex;
    justify-content: space-between;
    margin-top: 18px;
  }
  .popup-footer button {
    padding: 8px 18px;
    font-size: 14px;
    border-radius: 6px;
    border: 1px solid #999;
    background: #f5f5f5;
  }
  .popup-footer .confirm-btn {
    background: #1a5fb4;
    color: #fff;
    border-color: #1a5fb4;
    font-weight: bold;
  }

  #adminBtn, #autoShiftBtn, #manualShiftBtn, #reloadBtn {
    padding: 4px 10px;
  }

  .popup-field .error-text {
    color: #c01c28;
    font-size: 12px;
    margin-top: 6px;
    min-height: 14px;
  }

  .popup-field input[type="password"] {
    width: 100%;
    font-size: 14px;
    padding: 6px;
    box-sizing: border-box;
  }

  @media (max-width: 480px) {
    body { margin: 10px; }
    h1 { font-size: 16px; }
  }
</style>
</head>
<body>

<h1>シフト希望登録</h1>

<div class="controls">
  <button id="adminBtn">管理</button>
  <button id="autoShiftBtn">自動シフト作成</button>
  <button id="manualShiftBtn">シフトを自作する</button>
  <button id="reloadBtn">最新の入力を読み込む</button>
</div>

<div id="tableWrap"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="db.js"></script>
<script>
(async function () {
  await ShiftDB.ready();
  const WEEKDAY_LABELS = ["日", "月", "火", "水", "木", "金", "土"];

  const WISH_PRESETS = ["早イン", "早上がり", "ラスト"];
  const CUSTOM_VALUE = "__custom__";
  const NONE_VALUE = "";

  const START_OPTIONS = generateTimeOptions(15, 0, 21, 0, 30, (h, m) => `${pad(h)}:${pad(m)}~`);
  const END_OPTIONS = generateTimeOptions(18, 0, 24, 0, 30, (h, m) => `~${pad(h)}:${pad(m)}`);

  const ICON_CIRCLE = "../Circle.png";
  const ICON_CROSS = "../Cross.png";

  const AUTO_GENERATE_KEY = "shiftAutoGenerate";
  const MANUAL_CREATE_KEY = "shiftManualCreate";

  let state = loadState() || {
    startDate: defaultStartDate(),
    staff: [
      { id: cryptoId(), name: "" },
      { id: cryptoId(), name: "" },
      { id: cryptoId(), name: "" }
    ],
    cells: {},
    closedDates: [],
    shiftParams: {
      weekStartWeekday: 1,
      defaultClosedWeekdays: [3],
      openTimeByWeekday: { 0: "16:00", 1: "16:00", 2: "17:00", 3: "16:00", 4: "17:00", 5: "16:00", 6: "16:00" },
      temporaryClosedDates: []
    },
    prepNotes: {},
    recruitWeeks: 2
  };
  if (!state.closedDates) state.closedDates = [];
  if (!state.recruitWeeks) state.recruitWeeks = 2;
  if (!state.shiftParams) state.shiftParams = {};
  if (!state.shiftParams.defaultClosedWeekdays) {
    if (state.shiftParams.defaultClosedWeekday !== undefined && state.shiftParams.defaultClosedWeekday !== null) {
      state.shiftParams.defaultClosedWeekdays = [Number(state.shiftParams.defaultClosedWeekday)];
    } else {
      state.shiftParams.defaultClosedWeekdays = [];
    }
  }
  delete state.shiftParams.defaultClosedWeekday;
  if (!state.shiftParams.temporaryClosedDates) state.shiftParams.temporaryClosedDates = [];

  const tableWrap = document.getElementById("tableWrap");
  const adminBtn = document.getElementById("adminBtn");
  const autoShiftBtn = document.getElementById("autoShiftBtn");
  const manualShiftBtn = document.getElementById("manualShiftBtn");
  const reloadBtn = document.getElementById("reloadBtn");

  adminBtn.addEventListener("click", () => {
    ShiftDB.go("admin.html");
  });

  autoShiftBtn.addEventListener("click", () => {
    setSessionFlag(AUTO_GENERATE_KEY);
    ShiftDB.go("shift_generate.html");
  });

  manualShiftBtn.addEventListener("click", () => {
    setSessionFlag(MANUAL_CREATE_KEY);
    ShiftDB.go("shift_generate.html");
  });

  // メンバーがLINEから入力した最新の内容を読み込み直す
  reloadBtn.addEventListener("click", async () => {
    await ShiftDB.flush();
    window.location.reload();
  });

  render();

  function setSessionFlag(key) {
    try {
      sessionStorage.setItem(key, "1");
    } catch (e) {
      // sessionStorage unavailable; destination page opens without auto action
    }
  }

  function getDaysCount() {
    return (state.recruitWeeks || 2) * 7;
  }

  function render() {
    const dates = getDateRange(state.startDate, getDaysCount());

    let html = "<table><thead><tr><th>名前</th>";
    for (const d of dates) {
      const wd = d.getDay();
      const cls = wd === 0 ? "sun" : wd === 6 ? "sat" : "";
      html += `<th class="${cls}">${formatMonthDay(d)}<br>${WEEKDAY_LABELS[wd]}</th>`;
    }
    html += "</tr></thead><tbody>";

    const visibleStaff = state.staff.filter(p => p.name && p.name.trim() !== "");
    for (const person of visibleStaff) {
      html += `<tr><td class="name-display">${escapeHtml(person.name)}</td>`;

      for (const d of dates) {
        const dateKey = toIsoDate(d);
        const cellKey = person.id + "_" + dateKey;
        html += `<td>${renderCellButton(cellKey, isRecruitClosed(d))}</td>`;
      }
      html += "</tr>";
    }
    html += "</tbody></table>";

    tableWrap.innerHTML = html;
    bindTableEvents();
  }

  function isRecruitClosed(d) {
    const iso = toIsoDate(d);
    if ((state.shiftParams.temporaryClosedDates || []).includes(iso)) return true;
    return (state.shiftParams.defaultClosedWeekdays || []).includes(d.getDay());
  }

  function renderCellButton(cellKey, closed) {
    if (closed) {
      return `<div class="closed-slash-cell"></div>`;
    }
    const cell = state.cells[cellKey];
    let inner;
    let stateClass = "";
    if (!cell || !cell.mark) {
      inner = `<span class="placeholder">タップで入力</span>`;
    } else if (cell.mark === "×") {
      stateClass = "cell-cross";
      inner = `<img class="mark-img-big" src="${ICON_CROSS}" alt="×">`;
    } else {
      const timeLine = combineTime(cell.start, cell.end);
      const hasExtra = !!(timeLine || cell.wish);
      if (hasExtra) {
        stateClass = "cell-circle-partial";
        inner = `<img class="mark-img-small" src="${ICON_CIRCLE}" alt="○">`;
        if (timeLine) inner += `<div class="sub-line">${escapeHtml(timeLine)}</div>`;
        if (cell.wish) inner += `<div class="sub-line">${escapeHtml(cell.wish)}</div>`;
      } else {
        stateClass = "cell-circle-full";
        inner = `<img class="mark-img-big" src="${ICON_CIRCLE}" alt="○">`;
      }
    }
    return `<button class="cell-btn ${stateClass}" data-cell="${cellKey}">${inner}</button>`;
  }

  function combineTime(start, end) {
    if (start && end) return start.replace("~", "") + "~" + end.replace("~", "");
    if (start) return start;
    if (end) return end;
    return "";
  }

  function bindTableEvents() {
    tableWrap.querySelectorAll(".cell-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        openPopup(btn.dataset.cell);
      });
    });
  }

  // ---------- popup ----------

  function openPopup(cellKey) {
    const [staffId, dateIso] = splitCellKey(cellKey);
    const person = state.staff.find(p => p.id === staffId);
    const existing = state.cells[cellKey] || { mark: "", start: "", end: "", wish: "" };
    const draft = Object.assign({}, existing);

    const overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.innerHTML = buildPopupHtml(person, dateIso, draft);
    document.body.appendChild(overlay);

    overlay.addEventListener("click", (e) => {
      if (e.target === overlay) closePopup();
    });

    const popup = overlay.querySelector(".popup");

    function closePopup() {
      overlay.remove();
    }

    function setMark(mark) {
      draft.mark = draft.mark === mark ? "" : mark;
      refreshMarkButtons();
      refreshFieldDisabled();
    }

    function refreshMarkButtons() {
      popup.querySelector('[data-popmark="○"]').classList.toggle("selected", draft.mark === "○");
      popup.querySelector('[data-popmark="×"]').classList.toggle("selected", draft.mark === "×");
    }

    function refreshFieldDisabled() {
      const enabled = draft.mark === "○";
      popup.querySelectorAll(".time-wish-field select, .time-wish-field input[type=text]").forEach(el => {
        el.disabled = !enabled;
      });
    }

    popup.querySelector('[data-popmark="○"]').addEventListener("click", () => setMark("○"));
    popup.querySelector('[data-popmark="×"]').addEventListener("click", () => setMark("×"));

    const startSelect = popup.querySelector("#popStart");
    const startCustom = popup.querySelector("#popStartCustom");
    const endSelect = popup.querySelector("#popEnd");
    const endCustom = popup.querySelector("#popEndCustom");
    const wishSelect = popup.querySelector("#popWish");
    const wishCustom = popup.querySelector("#popWishCustom");

    startSelect.addEventListener("change", () => {
      startCustom.style.display = startSelect.value === CUSTOM_VALUE ? "block" : "none";
    });
    endSelect.addEventListener("change", () => {
      endCustom.style.display = endSelect.value === CUSTOM_VALUE ? "block" : "none";
    });
    wishSelect.addEventListener("change", () => {
      wishCustom.style.display = wishSelect.value === CUSTOM_VALUE ? "block" : "none";
    });

    popup.querySelector(".cancel-btn").addEventListener("click", closePopup);

    popup.querySelector(".confirm-btn").addEventListener("click", () => {
      const result = { mark: draft.mark, start: "", end: "", wish: "" };
      if (draft.mark === "○") {
        result.start = startSelect.value === CUSTOM_VALUE ? startCustom.value.trim() : startSelect.value;
        result.end = endSelect.value === CUSTOM_VALUE ? endCustom.value.trim() : endSelect.value;
        result.wish = wishSelect.value === CUSTOM_VALUE ? wishCustom.value.trim() : wishSelect.value;
      }
      if (result.mark) {
        state.cells[cellKey] = result;
      } else {
        delete state.cells[cellKey];
      }
      saveState();
      closePopup();
      render();
    });

    refreshMarkButtons();
    refreshFieldDisabled();
  }

  function buildPopupHtml(person, dateIso, draft) {
    const d = new Date(dateIso + "T00:00:00");
    const dateLabel = `${formatMonthDay(d)} (${WEEKDAY_LABELS[d.getDay()]})`;
    const name = person ? person.name || "(未入力)" : "";

    return `
      <div class="popup">
        <div class="popup-header">
          <div class="p-name">${escapeHtml(name)}</div>
          <div class="p-date">${dateLabel}</div>
        </div>
        <div class="popup-marks">
          <button class="popup-mark-btn" data-popmark="○"><img src="${ICON_CIRCLE}" alt="○"></button>
          <button class="popup-mark-btn" data-popmark="×"><img src="${ICON_CROSS}" alt="×"></button>
        </div>
        <div class="time-wish-field popup-field">
          <label>開始時刻希望</label>
          <select id="popStart">${buildOptionTags(START_OPTIONS, draft.start)}</select>
          <input type="text" id="popStartCustom" placeholder="例: 15:15~" style="display:${isCustom(START_OPTIONS, draft.start) ? "block" : "none"}" value="${isCustom(START_OPTIONS, draft.start) ? escapeHtml(draft.start) : ""}">
        </div>
        <div class="time-wish-field popup-field">
          <label>終了時刻希望</label>
          <select id="popEnd">${buildOptionTags(END_OPTIONS, draft.end)}</select>
          <input type="text" id="popEndCustom" placeholder="例: ~23:15" style="display:${isCustom(END_OPTIONS, draft.end) ? "block" : "none"}" value="${isCustom(END_OPTIONS, draft.end) ? escapeHtml(draft.end) : ""}">
        </div>
        <div class="time-wish-field popup-field">
          <label>希望</label>
          <select id="popWish">${buildOptionTags(WISH_PRESETS, draft.wish)}</select>
          <input type="text" id="popWishCustom" placeholder="自由記述" style="display:${isCustom(WISH_PRESETS, draft.wish) ? "block" : "none"}" value="${isCustom(WISH_PRESETS, draft.wish) ? escapeHtml(draft.wish) : ""}">
        </div>
        <div class="popup-footer">
          <button class="cancel-btn">キャンセル</button>
          <button class="confirm-btn">決定</button>
        </div>
      </div>
    `;
  }

  function buildOptionTags(presetList, currentValue) {
    const options = [`<option value="${NONE_VALUE}">指定なし</option>`];
    for (const opt of presetList) {
      const selected = opt === currentValue ? "selected" : "";
      options.push(`<option value="${escapeHtml(opt)}" ${selected}>${escapeHtml(opt)}</option>`);
    }
    const customSelected = isCustom(presetList, currentValue) ? "selected" : "";
    options.push(`<option value="${CUSTOM_VALUE}" ${customSelected}>自由入力</option>`);
    return options.join("");
  }

  function isCustom(presetList, value) {
    return !!value && !presetList.includes(value);
  }

  function splitCellKey(cellKey) {
    const idx = cellKey.lastIndexOf("_");
    return [cellKey.slice(0, idx), cellKey.slice(idx + 1)];
  }

  function generateTimeOptions(startH, startM, endH, endM, stepMin, formatFn) {
    const result = [];
    let totalStart = startH * 60 + startM;
    let totalEnd = endH * 60 + endM;
    for (let t = totalStart; t <= totalEnd; t += stepMin) {
      const h = Math.floor(t / 60);
      const m = t % 60;
      result.push(formatFn(h, m));
    }
    return result;
  }

  function pad(n) {
    return String(n).padStart(2, "0");
  }

  function saveState() {
    ShiftDB.save(state);
  }

  function loadState() {
    return ShiftDB.loaded();
  }

  function defaultStartDate() {
    // 週の開始曜日の初期値（月曜日）に合わせ、直近の月曜日を初期値とする
    const WEEK_START_WEEKDAY = 1; // 0=日,1=月,...
    const today = new Date();
    const diff = (today.getDay() - WEEK_START_WEEKDAY + 7) % 7;
    const monday = new Date(today);
    monday.setDate(today.getDate() - diff);
    return toIsoDate(monday);
  }

  function getDateRange(startIso, count) {
    const result = [];
    const base = new Date(startIso + "T00:00:00");
    for (let i = 0; i < count; i++) {
      const d = new Date(base);
      d.setDate(base.getDate() + i);
      result.push(d);
    }
    return result;
  }

  function toIsoDate(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  }

  function formatMonthDay(d) {
    return `${d.getMonth() + 1}/${d.getDate()}`;
  }

  function cryptoId() {
    return Math.random().toString(36).slice(2, 10);
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }
})();
</script>

</body>
</html>
