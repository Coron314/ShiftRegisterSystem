<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>パスワード管理</title>
<style>
  * {
    box-sizing: border-box;
  }
  body {
    font-family: "Yu Gothic", "Meiryo", sans-serif;
    margin: 16px;
    font-size: 14px;
  }
  h1 {
    font-size: 18px;
    margin-bottom: 12px;
  }
  .controls {
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  button {
    cursor: pointer;
    font-size: 13px;
  }
  #backBtn, #changeBtn {
    padding: 4px 10px;
  }
  .form {
    max-width: 320px;
    width: 100%;
  }
  .form-field {
    margin-bottom: 12px;
  }
  .form-field label {
    display: block;
    font-size: 12px;
    color: #555;
    margin-bottom: 2px;
  }
  .form-field input {
    width: 100%;
    font-size: 16px;
    padding: 6px;
  }
  .message {
    font-size: 12px;
    min-height: 16px;
    margin-top: 8px;
  }
  .message.error {
    color: #c01c28;
  }
  .message.ok {
    color: #1e6b34;
  }

  /* --- popup (password gate) --- */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .popup {
    background: #fff;
    border-radius: 10px;
    padding: 20px 24px;
    width: 340px;
    max-width: 90vw;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  .popup-header {
    text-align: center;
    margin-bottom: 14px;
  }
  .popup-header .p-date {
    font-size: 20px;
    font-weight: bold;
  }
  .popup-field {
    margin-bottom: 10px;
  }
  .popup-field .error-text {
    color: #c01c28;
    font-size: 12px;
    margin-top: 6px;
    min-height: 14px;
  }
  .popup-footer {
    display: flex;
    justify-content: space-between;
    margin-top: 18px;
  }
  .popup-footer button {
    padding: 8px 18px;
    font-size: 14px;
    border-radius: 6px;
    border: 1px solid #999;
    background: #f5f5f5;
  }
  .popup-footer .confirm-btn {
    background: #1a5fb4;
    color: #fff;
    border-color: #1a5fb4;
    font-weight: bold;
  }

  #adminContent {
    display: none;
  }
</style>
</head>
<body>

<h1>パスワード管理</h1>

<div id="adminContent">
  <div class="controls">
    <button id="backBtn">← 管理ページに戻る</button>
  </div>

  <div class="form">
    <div class="form-field">
      <label for="currentPassword">現在のパスワード</label>
      <input type="password" id="currentPassword" inputmode="numeric" maxlength="4" autocomplete="off">
    </div>
    <div class="form-field">
      <label for="newPassword">新しいパスワード（4桁の数字）</label>
      <input type="password" id="newPassword" inputmode="numeric" maxlength="4" autocomplete="off">
    </div>
    <div class="form-field">
      <label for="newPasswordConfirm">新しいパスワード（確認のためもう一度）</label>
      <input type="password" id="newPasswordConfirm" inputmode="numeric" maxlength="4" autocomplete="off">
    </div>
    <button id="changeBtn">変更する</button>
    <div class="message" id="message"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="db.js"></script>
<script>
(async function () {
  await ShiftDB.requireAuth();

  const adminContent = document.getElementById("adminContent");
  const backBtn = document.getElementById("backBtn");
  const currentInput = document.getElementById("currentPassword");
  const newInput = document.getElementById("newPassword");
  const confirmInput = document.getElementById("newPasswordConfirm");
  const changeBtn = document.getElementById("changeBtn");
  const message = document.getElementById("message");

  backBtn.addEventListener("click", () => {
    ShiftDB.go("admin.html");
  });

  changeBtn.addEventListener("click", async () => {
    const current = currentInput.value.trim();
    const next = newInput.value.trim();
    const nextConfirm = confirmInput.value.trim();
    if (!current) {
      showMessage("現在のパスワードを入力してください", true);
      return;
    }
    if (!/^[0-9]{4}$/.test(next)) {
      showMessage("新しいパスワードは4桁の数字で入力してください", true);
      return;
    }
    if (next !== nextConfirm) {
      showMessage("新しいパスワードが確認用と一致しません", true);
      return;
    }
    changeBtn.disabled = true;
    showMessage("", false);
    try {
      const ok = await ShiftDB.changePassword(current, next);
      if (!ok) {
        showMessage("現在のパスワードが違います", true);
        return;
      }
      currentInput.value = "";
      newInput.value = "";
      confirmInput.value = "";
      showMessage("パスワードを変更しました", false);
    } catch (e) {
      console.error(e);
      showMessage("変更できませんでした。通信状態を確認してください", true);
    } finally {
      changeBtn.disabled = false;
    }
  });

  function showMessage(text, isError) {
    message.textContent = text;
    message.className = "message " + (isError ? "error" : "ok");
  }

  adminContent.style.display = "block";
})();
</script>

</body>
</html>
