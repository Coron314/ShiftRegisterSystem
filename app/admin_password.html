<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>パスワード管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>パスワード管理</h1>

<div id="adminContent">
  <div class="controls">
    <button id="backBtn" class="btn btn-quiet">← 管理ページに戻る</button>
  </div>

  <div class="form">
    <div class="form-field">
      <label for="currentPassword">現在のパスワード</label>
      <input type="password" id="currentPassword" inputmode="numeric" maxlength="4" autocomplete="off">
    </div>
    <div class="form-field">
      <label for="newPassword">新しいパスワード（4桁の数字）</label>
      <input type="password" id="newPassword" inputmode="numeric" maxlength="4" autocomplete="off">
    </div>
    <div class="form-field">
      <label for="newPasswordConfirm">新しいパスワード（確認のためもう一度）</label>
      <input type="password" id="newPasswordConfirm" inputmode="numeric" maxlength="4" autocomplete="off">
    </div>
    <button id="changeBtn" class="btn btn-primary">変更する</button>
    <div class="message" id="message"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="db.js"></script>
<script>
(async function () {
  await ShiftDB.requireAuth();

  const adminContent = document.getElementById("adminContent");
  const backBtn = document.getElementById("backBtn");
  const currentInput = document.getElementById("currentPassword");
  const newInput = document.getElementById("newPassword");
  const confirmInput = document.getElementById("newPasswordConfirm");
  const changeBtn = document.getElementById("changeBtn");
  const message = document.getElementById("message");

  backBtn.addEventListener("click", () => {
    ShiftDB.go("admin.html");
  });

  changeBtn.addEventListener("click", async () => {
    const current = currentInput.value.trim();
    const next = newInput.value.trim();
    const nextConfirm = confirmInput.value.trim();
    if (!current) {
      showMessage("現在のパスワードを入力してください", true);
      return;
    }
    if (!/^[0-9]{4}$/.test(next)) {
      showMessage("新しいパスワードは4桁の数字で入力してください", true);
      return;
    }
    if (next !== nextConfirm) {
      showMessage("新しいパスワードが確認用と一致しません", true);
      return;
    }
    changeBtn.disabled = true;
    showMessage("", false);
    try {
      const ok = await ShiftDB.changePassword(current, next);
      if (!ok) {
        showMessage("現在のパスワードが違います", true);
        return;
      }
      currentInput.value = "";
      newInput.value = "";
      confirmInput.value = "";
      showMessage("パスワードを変更しました", false);
    } catch (e) {
      console.error(e);
      showMessage("変更できませんでした。通信状態を確認してください", true);
    } finally {
      changeBtn.disabled = false;
    }
  });

  function showMessage(text, isError) {
    message.textContent = text;
    message.className = "message " + (isError ? "error" : "ok");
  }

  adminContent.style.display = "block";
})();
</script>

</body>
</html>
