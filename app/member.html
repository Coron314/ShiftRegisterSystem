<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>シフト希望登録</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
    margin: 0;
    padding: 16px 16px 40px;
    font-size: 15px;
    color: #222;
    background: #f6f7f9;
  }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .me-line { font-size: 14px; color: #444; margin-bottom: 2px; }
  .me-line b { font-size: 16px; color: #222; }
  .relink-btn {
    border: none; background: none; color: #1a5fb4; font-size: 12px; padding: 0 0 0 6px;
    text-decoration: underline; cursor: pointer;
  }
  .period { font-size: 13px; color: #555; margin: 6px 0 4px; }
  .progress { font-size: 13px; color: #555; margin-bottom: 12px; }
  .message { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 18px 16px; line-height: 1.7; }

  .day-list { display: flex; flex-direction: column; gap: 6px; }
  .day-row {
    display: flex; align-items: center; gap: 12px; width: 100%;
    min-height: 54px; padding: 6px 12px;
    background: #fff; border: 1px solid #ccc; border-radius: 8px;
    font: inherit; color: inherit; text-align: left; cursor: pointer;
  }
  .day-row.cell-cross { background: #fde3e3; }
  .day-row.cell-circle-full { background: #dbeafe; }
  .day-row.cell-circle-partial { background: #eff6ff; }
  .day-row.closed { background: #eee; color: #999; cursor: default; border-style: dashed; }
  .day-label { width: 76px; flex: none; font-weight: bold; }
  .day-label .wd { font-weight: normal; font-size: 13px; }
  .sat { color: #1a5fb4; }
  .sun { color: #c01c28; }
  .day-value { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .day-value img { width: 28px; height: 28px; flex: none; }
  .day-value .sub { font-size: 13px; line-height: 1.4; }
  .day-value .placeholder { color: #aaa; font-size: 13px; }

  .name-list { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .name-btn {
    padding: 12px; font-size: 16px; border-radius: 8px; border: 1px solid #bbb;
    background: #fff; cursor: pointer; text-align: left;
  }

  /* --- popup（シフト希望登録画面と同じ） --- */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4);
    display: flex; align-items: center; justify-content: center; z-index: 100;
  }
  .popup {
    background: #fff; border-radius: 10px; padding: 20px 24px;
    width: 340px; max-width: 92vw; box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  .popup-header { text-align: center; margin-bottom: 14px; }
  .popup-header .p-name { font-size: 13px; color: #666; }
  .popup-header .p-date { font-size: 20px; font-weight: bold; }
  .popup-marks { display: flex; justify-content: center; gap: 16px; margin-bottom: 18px; }
  .popup-mark-btn {
    width: 70px; height: 56px; border: 2px solid #ccc; border-radius: 8px; background: #fafafa;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .popup-mark-btn img { width: 34px; height: 34px; display: block; }
  .popup-mark-btn.selected { border-color: #666; background: #e4e4e4; }
  .popup-field { margin-bottom: 10px; }
  .popup-field label { display: block; font-size: 12px; color: #555; margin-bottom: 2px; }
  .popup-field select, .popup-field input[type="text"] { width: 100%; font-size: 16px; padding: 4px; }
  .popup-field input[type="text"] { margin-top: 4px; }
  .popup-footer { display: flex; justify-content: space-between; margin-top: 18px; }
  .popup-footer button {
    padding: 8px 18px; font-size: 14px; border-radius: 6px; border: 1px solid #999; background: #f5f5f5; cursor: pointer;
  }
  .popup-footer .confirm-btn { background: #1a5fb4; color: #fff; border-color: #1a5fb4; font-weight: bold; }
  .popup-footer button:disabled { opacity: 0.6; }

  .toast {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    padding: 8px 16px; border-radius: 6px; font-size: 13px; z-index: 200;
    background: #e6f4ea; color: #1e6b34; border: 1px solid #a8d5b5; display: none;
  }
  .toast.error { background: #fde3e3; color: #c01c28; border-color: #f2a7a7; font-weight: bold; }
</style>
</head>
<body>

<h1>シフト希望登録</h1>
<div id="app"><div class="message">読み込み中…</div></div>
<div class="toast" id="toast"></div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="config.js"></script>
<script>
(function () {
  const cfg = window.SHIFT_CONFIG;
  const API_URL = cfg.SUPABASE_URL + "/functions/v1/member-api";
  const WEEKDAY_LABELS = ["日", "月", "火", "水", "木", "金", "土"];
  const WISH_PRESETS = ["早イン", "早上がり", "ラスト"];
  const CUSTOM_VALUE = "__custom__";
  const NONE_VALUE = "";
  const START_OPTIONS = generateTimeOptions(15, 0, 21, 0, 30, (h, m) => `${pad(h)}:${pad(m)}~`);
  const END_OPTIONS = generateTimeOptions(18, 0, 24, 0, 30, (h, m) => `~${pad(h)}:${pad(m)}`);
  const ICON_CIRCLE = "../Circle.png";
  const ICON_CROSS = "../Cross.png";

  const app = document.getElementById("app");
  const toastEl = document.getElementById("toast");
  let accessToken = null;
  let data = null;   // member-api の init / link の結果
  let toastTimer = null;

  start();

  async function start() {
    try {
      await liff.init({ liffId: cfg.LIFF_ID });
      if (!liff.isLoggedIn()) {
        liff.login({ redirectUri: location.href });
        return;
      }
      accessToken = liff.getAccessToken();
      data = await api({ action: "init" });
      render();
    } catch (e) {
      console.error(e);
      showMessage("読み込めませんでした。LINEのトーク画面からもう一度開き直してください。");
    }
  }

  async function api(payload) {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json", apikey: cfg.SUPABASE_KEY },
      body: JSON.stringify(Object.assign({ accessToken }, payload))
    });
    if (res.status === 401) {
      // LINEのログインの有効期限切れ。ログインし直して開き直す
      liff.logout();
      location.reload();
      throw new Error("auth");
    }
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.error || "error");
    return body;
  }

  function showMessage(text) {
    app.innerHTML = `<div class="message">${escapeHtml(text)}</div>`;
  }

  function render() {
    if (!data.startDate) {
      showMessage("現在募集しているシフトはありません。");
      return;
    }
    if (!data.myStaffId) {
      renderNameSelect();
      return;
    }
    renderDays();
  }

  // ---------- 初回：自分の名前を選ぶ ----------

  function renderNameSelect() {
    if (data.staff.length === 0) {
      showMessage("スタッフが登録されていません。バイトリーダーに確認してください。");
      return;
    }
    let html = `<div class="message">あなたの名前を選んでください。<br>次回からは自動で表示されます。</div><div class="name-list">`;
    for (const s of data.staff) {
      html += `<button class="name-btn" data-staff="${escapeHtml(s.id)}">${escapeHtml(s.name)}</button>`;
    }
    html += "</div>";
    app.innerHTML = html;
    app.querySelectorAll(".name-btn").forEach(btn => {
      btn.addEventListener("click", async () => {
        const person = data.staff.find(s => s.id === btn.dataset.staff);
        if (!confirm(`「${person.name}」で登録します。よろしいですか？`)) return;
        try {
          data = await api({ action: "link", staffId: person.id });
          render();
        } catch (e) {
          showToast("登録できませんでした。もう一度お試しください。", true);
        }
      });
    });
  }

  // ---------- 日付の一覧 ----------

  function myName() {
    const me = data.staff.find(s => s.id === data.myStaffId);
    return me ? me.name : "";
  }

  function renderDays() {
    const dates = getDateRange(data.startDate, data.weeks * 7);
    const openDates = dates.filter(d => !data.closedDates.includes(toIsoDate(d)));
    const filled = openDates.filter(d => data.cells[toIsoDate(d)]).length;

    let html = `<div class="me-line"><b>${escapeHtml(myName())}</b> さん<button class="relink-btn" id="relinkBtn">名前を選び直す</button></div>`;
    html += `<div class="period">${formatLong(dates[0])} 〜 ${formatLong(dates[dates.length - 1])}</div>`;
    html += `<div class="progress">入力済み ${filled} / ${openDates.length}日（入力すると自動で保存されます）</div>`;
    html += `<div class="day-list">`;
    for (const d of dates) {
      const iso = toIsoDate(d);
      const wd = d.getDay();
      const wdClass = wd === 0 ? "sun" : wd === 6 ? "sat" : "";
      const label = `<span class="day-label">${formatMonthDay(d)} <span class="wd ${wdClass}">(${WEEKDAY_LABELS[wd]})</span></span>`;
      if (data.closedDates.includes(iso)) {
        html += `<div class="day-row closed">${label}<span class="day-value">休業日</span></div>`;
        continue;
      }
      const { cls, inner } = cellView(data.cells[iso]);
      html += `<button class="day-row ${cls}" data-date="${iso}">${label}<span class="day-value">${inner}</span></button>`;
    }
    html += "</div>";
    app.innerHTML = html;

    app.querySelectorAll(".day-row[data-date]").forEach(btn => {
      btn.addEventListener("click", () => openPopup(btn.dataset.date));
    });
    document.getElementById("relinkBtn").addEventListener("click", () => {
      if (!confirm("名前を選び直しますか？")) return;
      data.myStaffId = null;
      renderNameSelect();
    });
  }

  function cellView(cell) {
    if (!cell || !cell.mark) {
      return { cls: "", inner: `<span class="placeholder">タップして入力</span>` };
    }
    if (cell.mark === "×") {
      return { cls: "cell-cross", inner: `<img src="${ICON_CROSS}" alt="×"><span class="sub">出勤できない</span>` };
    }
    const timeLine = combineTime(cell.start, cell.end);
    const lines = [timeLine, cell.wish].filter(Boolean).map(escapeHtml);
    if (lines.length === 0) {
      return { cls: "cell-circle-full", inner: `<img src="${ICON_CIRCLE}" alt="○"><span class="sub">出勤できる</span>` };
    }
    return { cls: "cell-circle-partial", inner: `<img src="${ICON_CIRCLE}" alt="○"><span class="sub">${lines.join("<br>")}</span>` };
  }

  function combineTime(start, end) {
    if (start && end) return start.replace("~", "") + "~" + end.replace("~", "");
    return start || end || "";
  }

  // ---------- 入力ポップアップ（シフト希望登録画面と同じ） ----------

  function openPopup(dateIso) {
    const existing = data.cells[dateIso] || { mark: "", start: "", end: "", wish: "" };
    const draft = Object.assign({}, existing);

    const overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.innerHTML = buildPopupHtml(dateIso, draft);
    document.body.appendChild(overlay);
    overlay.addEventListener("click", (e) => {
      if (e.target === overlay) overlay.remove();
    });

    const popup = overlay.querySelector(".popup");
    const startSelect = popup.querySelector("#popStart");
    const startCustom = popup.querySelector("#popStartCustom");
    const endSelect = popup.querySelector("#popEnd");
    const endCustom = popup.querySelector("#popEndCustom");
    const wishSelect = popup.querySelector("#popWish");
    const wishCustom = popup.querySelector("#popWishCustom");
    const confirmBtn = popup.querySelector(".confirm-btn");

    function setMark(mark) {
      draft.mark = draft.mark === mark ? "" : mark;
      refreshMark();
    }
    function refreshMark() {
      popup.querySelector('[data-popmark="○"]').classList.toggle("selected", draft.mark === "○");
      popup.querySelector('[data-popmark="×"]').classList.toggle("selected", draft.mark === "×");
      popup.querySelectorAll(".time-wish-field select, .time-wish-field input[type=text]").forEach(el => {
        el.disabled = draft.mark !== "○";
      });
    }
    popup.querySelector('[data-popmark="○"]').addEventListener("click", () => setMark("○"));
    popup.querySelector('[data-popmark="×"]').addEventListener("click", () => setMark("×"));
    startSelect.addEventListener("change", () => { startCustom.style.display = startSelect.value === CUSTOM_VALUE ? "block" : "none"; });
    endSelect.addEventListener("change", () => { endCustom.style.display = endSelect.value === CUSTOM_VALUE ? "block" : "none"; });
    wishSelect.addEventListener("change", () => { wishCustom.style.display = wishSelect.value === CUSTOM_VALUE ? "block" : "none"; });
    popup.querySelector(".cancel-btn").addEventListener("click", () => overlay.remove());

    confirmBtn.addEventListener("click", async () => {
      let cell = null;
      if (draft.mark === "×") {
        cell = { mark: "×", start: "", end: "", wish: "" };
      } else if (draft.mark === "○") {
        cell = {
          mark: "○",
          start: startSelect.value === CUSTOM_VALUE ? startCustom.value.trim() : startSelect.value,
          end: endSelect.value === CUSTOM_VALUE ? endCustom.value.trim() : endSelect.value,
          wish: wishSelect.value === CUSTOM_VALUE ? wishCustom.value.trim() : wishSelect.value
        };
      }
      confirmBtn.disabled = true;
      try {
        const res = await api({ action: "save", date: dateIso, cell });
        if (res.cell) data.cells[dateIso] = res.cell;
        else delete data.cells[dateIso];
        overlay.remove();
        renderDays();
        showToast("保存しました");
      } catch (e) {
        confirmBtn.disabled = false;
        showToast("保存できませんでした。通信状態を確認してください。", true);
      }
    });

    refreshMark();
  }

  function buildPopupHtml(dateIso, draft) {
    const d = new Date(dateIso + "T00:00:00");
    const dateLabel = `${formatMonthDay(d)} (${WEEKDAY_LABELS[d.getDay()]})`;
    return `
      <div class="popup">
        <div class="popup-header">
          <div class="p-name">${escapeHtml(myName())}</div>
          <div class="p-date">${dateLabel}</div>
        </div>
        <div class="popup-marks">
          <button class="popup-mark-btn" data-popmark="○"><img src="${ICON_CIRCLE}" alt="○"></button>
          <button class="popup-mark-btn" data-popmark="×"><img src="${ICON_CROSS}" alt="×"></button>
        </div>
        <div class="time-wish-field popup-field">
          <label>開始時刻希望</label>
          <select id="popStart">${buildOptionTags(START_OPTIONS, draft.start)}</select>
          <input type="text" id="popStartCustom" placeholder="例: 15:15~" style="display:${isCustom(START_OPTIONS, draft.start) ? "block" : "none"}" value="${isCustom(START_OPTIONS, draft.start) ? escapeHtml(draft.start) : ""}">
        </div>
        <div class="time-wish-field popup-field">
          <label>終了時刻希望</label>
          <select id="popEnd">${buildOptionTags(END_OPTIONS, draft.end)}</select>
          <input type="text" id="popEndCustom" placeholder="例: ~23:15" style="display:${isCustom(END_OPTIONS, draft.end) ? "block" : "none"}" value="${isCustom(END_OPTIONS, draft.end) ? escapeHtml(draft.end) : ""}">
        </div>
        <div class="time-wish-field popup-field">
          <label>希望</label>
          <select id="popWish">${buildOptionTags(WISH_PRESETS, draft.wish)}</select>
          <input type="text" id="popWishCustom" placeholder="自由記述" style="display:${isCustom(WISH_PRESETS, draft.wish) ? "block" : "none"}" value="${isCustom(WISH_PRESETS, draft.wish) ? escapeHtml(draft.wish) : ""}">
        </div>
        <div class="popup-footer">
          <button class="cancel-btn">キャンセル</button>
          <button class="confirm-btn">決定</button>
        </div>
      </div>
    `;
  }

  function buildOptionTags(presetList, currentValue) {
    const options = [`<option value="${NONE_VALUE}">指定なし</option>`];
    for (const opt of presetList) {
      const selected = opt === currentValue ? "selected" : "";
      options.push(`<option value="${escapeHtml(opt)}" ${selected}>${escapeHtml(opt)}</option>`);
    }
    const customSelected = isCustom(presetList, currentValue) ? "selected" : "";
    options.push(`<option value="${CUSTOM_VALUE}" ${customSelected}>自由入力</option>`);
    return options.join("");
  }

  function isCustom(presetList, value) {
    return !!value && !presetList.includes(value);
  }

  // ---------- 共通 ----------

  function showToast(text, isError) {
    clearTimeout(toastTimer);
    toastEl.textContent = text;
    toastEl.className = "toast" + (isError ? " error" : "");
    toastEl.style.display = "block";
    toastTimer = setTimeout(() => { toastEl.style.display = "none"; }, isError ? 4000 : 1500);
  }

  function generateTimeOptions(startH, startM, endH, endM, stepMin, formatFn) {
    const result = [];
    for (let t = startH * 60 + startM; t <= endH * 60 + endM; t += stepMin) {
      result.push(formatFn(Math.floor(t / 60), t % 60));
    }
    return result;
  }

  function getDateRange(startIso, count) {
    const result = [];
    const base = new Date(startIso + "T00:00:00");
    for (let i = 0; i < count; i++) {
      const d = new Date(base);
      d.setDate(base.getDate() + i);
      result.push(d);
    }
    return result;
  }

  function toIsoDate(d) {
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }

  function formatMonthDay(d) {
    return `${d.getMonth() + 1}/${d.getDate()}`;
  }

  function formatLong(d) {
    return `${d.getMonth() + 1}/${d.getDate()}(${WEEKDAY_LABELS[d.getDay()]})`;
  }

  function pad(n) {
    return String(n).padStart(2, "0");
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }
})();
</script>
</body>
</html>
